name: Publish Facebook Plus Rootless and RootHide to APT

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apt-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and validate Facebook Plus v1.0.2-2 DEBs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="1.0.2-2"
          TAG="v${VERSION}"
          mkdir -p /tmp/fbplus-release debs
          for scheme in rootless roothide; do
            asset="Facebook-Plus-v${VERSION}-${scheme}.deb"
            gh release download "$TAG" --repo ttlongdl/Facebook-Plus --pattern "$asset" --dir /tmp/fbplus-release
            deb="/tmp/fbplus-release/$asset"
            test -s "$deb"
            test "$(dpkg-deb -f "$deb" Package)" = "com.shajon.fbplus"
            test "$(dpkg-deb -f "$deb" Version)" = "$VERSION"
            case "$scheme" in
              rootless) arch="iphoneos-arm64" ;;
              roothide) arch="iphoneos-arm64e" ;;
            esac
            test "$(dpkg-deb -f "$deb" Architecture)" = "$arch"
            contents="/tmp/fbplus-release/${scheme}-contents.txt"
            dpkg-deb --contents "$deb" > "$contents"
            grep -Fq 'FacebookPlus.dylib' "$contents"
            grep -Fq 'FacebookPlus.bundle' "$contents"
            dest="debs/com.shajon.fbplus_${VERSION}_${arch}.deb"
            cp "$deb" "$dest"
            echo "Staged $dest"
          done

      - name: Regenerate APT indexes and validate both architectures
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y dpkg-dev
          dpkg-scanpackages --multiversion debs /dev/null > Packages
          gzip -n -9c Packages > Packages.gz
          for arch in iphoneos-arm64 iphoneos-arm64e; do
            grep -A 18 -F 'Version: 1.0.2-2' Packages | grep -Fq "Architecture: $arch" || {
              echo "::error::Missing Facebook Plus 1.0.2-2 $arch in Packages"
              exit 1
            }
            grep -Fq "Filename: debs/com.shajon.fbplus_1.0.2-2_${arch}.deb" Packages
          done
          echo "Both packages indexed; existing package versions retained for rollback."

      - name: Commit and push only if changed
        run: |
          set -euo pipefail
          git add debs Packages Packages.gz
          if git diff --cached --quiet; then
            echo "APT repo already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish Facebook Plus v1.0.2-2 Rootless and RootHide"
          git push
