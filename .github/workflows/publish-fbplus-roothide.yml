name: Publish Facebook Plus Rootless and RootHide to APT

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apt-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and validate latest released Facebook Plus DEBs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$(gh api repos/ttlongdl/Facebook-Plus/releases/latest --jq '.tag_name')"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]] || { echo "::error::Unexpected FBPlus release tag: $TAG"; exit 1; }
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p /tmp/fbplus-release debs
          for scheme in rootless roothide; do
            asset="Facebook-Plus-v${VERSION}-${scheme}.deb"
            gh release download "$TAG" --repo ttlongdl/Facebook-Plus --pattern "$asset" --dir /tmp/fbplus-release
            deb="/tmp/fbplus-release/$asset"
            test -s "$deb"
            test "$(dpkg-deb -f "$deb" Package)" = "com.shajon.fbplus"
            test "$(dpkg-deb -f "$deb" Version)" = "$VERSION"
            case "$scheme" in
              rootless) arch="iphoneos-arm64" ;;
              roothide) arch="iphoneos-arm64e" ;;
            esac
            test "$(dpkg-deb -f "$deb" Architecture)" = "$arch"
            contents="/tmp/fbplus-release/${scheme}-contents.txt"
            dpkg-deb --contents "$deb" > "$contents"
            grep -Fq 'FacebookPlus.dylib' "$contents"
            grep -Fq 'FacebookPlus.bundle' "$contents"
            dest="debs/com.shajon.fbplus_${VERSION}_${arch}.deb"
            cp "$deb" "$dest"
            echo "Staged $dest"
          done

      - name: Regenerate APT indexes and validate both architectures
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y dpkg-dev
          dpkg-scanpackages --multiversion debs /dev/null > Packages
          gzip -n -9c Packages > Packages.gz
          for arch in iphoneos-arm64 iphoneos-arm64e; do
            awk -v v="$VERSION" -v a="$arch" '
              BEGIN { RS=""; FS="\\n"; found=0 }
              {
                pkg=ver=architecture=filename=""
                for(i=1;i<=NF;i++) {
                  if($i=="Package: com.shajon.fbplus") pkg=1
                  if($i=="Version: " v) ver=1
                  if($i=="Architecture: " a) architecture=1
                  if($i=="Filename: debs/com.shajon.fbplus_" v "_" a ".deb") filename=1
                }
                if(pkg && ver && architecture && filename) found=1
              }
              END { exit !found }
            ' Packages || { echo "::error::Missing FBPlus $VERSION $arch in Packages"; exit 1; }
          done
          echo "Both packages indexed; existing package versions retained for rollback."

      - name: Commit and push only if changed
        run: |
          set -euo pipefail
          git add debs Packages Packages.gz
          if git diff --cached --quiet; then
            echo "APT repo already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish Facebook Plus v${VERSION} Rootless and RootHide"
          git push
