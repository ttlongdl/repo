name: Publish FBAudioFix official

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-fbaudiofix.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download latest FBAudioFix release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/fbaudiofix

          TAG="$(gh release view --repo ttlongdl/FBAudioFix --json tagName --jq '.tagName')"
          VERSION="${TAG#v}"
          ASSET="FBAudioFix-v${VERSION}-rootless.deb"
          echo "Publishing FBAudioFix ${TAG}: ${ASSET}"

          gh release download "$TAG" \
            --repo ttlongdl/FBAudioFix \
            --pattern "$ASSET" \
            --dir /tmp/fbaudiofix

          DEB="/tmp/fbaudiofix/$ASSET"
          test -s "$DEB"
          ACTUAL_VERSION="$(dpkg-deb -f "$DEB" Version)"
          ACTUAL_PACKAGE="$(dpkg-deb -f "$DEB" Package)"
          ACTUAL_ARCH="$(dpkg-deb -f "$DEB" Architecture)"
          echo "DEB metadata: Package=$ACTUAL_PACKAGE Version=$ACTUAL_VERSION Architecture=$ACTUAL_ARCH"
          if [ "$ACTUAL_VERSION" != "$VERSION" ]; then
            echo "::error::Release tag $TAG disagrees with DEB Version $ACTUAL_VERSION"
            exit 1
          fi
          if [ "$ACTUAL_PACKAGE" != "com.ttlongdl.fbaudiofix" ] || [ "$ACTUAL_ARCH" != "iphoneos-arm64" ]; then
            echo "::error::Unexpected DEB package or architecture"
            exit 1
          fi

          rm -f debs/com.ttlongdl.fbaudiofix_*_iphoneos-arm64.deb
          cp "$DEB" "debs/${ACTUAL_PACKAGE}_${ACTUAL_VERSION}_${ACTUAL_ARCH}.deb"

      - name: Rebuild APT indexes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y dpkg-dev
          dpkg-scanpackages --multiversion debs /dev/null > Packages
          gzip -9c Packages > Packages.gz

      - name: Commit official release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debs Packages Packages.gz
          if git diff --cached --quiet; then
            echo "APT repository already up to date."
          else
            VERSION="$(dpkg-deb -f "$(find debs -maxdepth 1 -name 'com.ttlongdl.fbaudiofix_*_iphoneos-arm64.deb' -print -quit)" Version)"
            git commit -m "Publish FBAudioFix ${VERSION} official"
            git push
          fi
