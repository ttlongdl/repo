name: Publish Facebook Plus official

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-fbplus-baseline.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Facebook Plus v1.0.1-5 rootless release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p /tmp/fbplus
          gh release download v1.0.1-5 \
            --repo ttlongdl/Facebook-Plus \
            --pattern "Facebook-Plus-v1.0.1-5-rootless.deb" \
            --dir /tmp/fbplus
          ROOTLESS="/tmp/fbplus/Facebook-Plus-v1.0.1-5-rootless.deb"
          test -s "$ROOTLESS"

          # Keep only the current Facebook Plus package in the APT pool.
          rm -f debs/com.shajon.fbplus_*_iphoneos-arm64.deb
          cp "$ROOTLESS" debs/com.shajon.fbplus_1.0.1-5_iphoneos-arm64.deb
      - name: Rebuild APT indexes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y dpkg-dev
          dpkg-scanpackages --multiversion debs /dev/null > Packages
          gzip -9c Packages > Packages.gz
      - name: Commit official release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Facebook Plus 1.0.1-5 official"
          git push
