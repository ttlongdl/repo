name: Publish Facebook Plus official

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-fbplus-baseline.yml'

permissions:
  contents: write

concurrency:
  group: publish-facebook-plus
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and validate latest Facebook Plus rootless release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/fbplus
          TAG="$(gh release view --repo ttlongdl/Facebook-Plus --json tagName --jq '.tagName')"
          VERSION="${TAG#v}"
          ASSET="Facebook-Plus-v${VERSION}-rootless.deb"
          echo "Publishing ${TAG} / ${ASSET}"
          gh release download "$TAG" --repo ttlongdl/Facebook-Plus --pattern "$ASSET" --dir /tmp/fbplus
          DEB="/tmp/fbplus/$ASSET"
          test -s "$DEB"
          PKG="$(dpkg-deb -f "$DEB" Package)"
          VER="$(dpkg-deb -f "$DEB" Version)"
          ARCH="$(dpkg-deb -f "$DEB" Architecture)"
          echo "Package=$PKG Version=$VER Architecture=$ARCH"
          test "$PKG" = "com.shajon.fbplus"
          test "$VER" = "$VERSION"
          test "$ARCH" = "iphoneos-arm64"
          sha256sum "$DEB"
          # Retain other packages; replace only the old Facebook Plus rootless version.
          rm -f debs/com.shajon.fbplus_*_iphoneos-arm64.deb
          cp "$DEB" "debs/${PKG}_${VER}_${ARCH}.deb"
      - name: Rebuild APT indexes
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y dpkg-dev
          dpkg-scanpackages --multiversion debs /dev/null > Packages
          gzip -9c Packages > Packages.gz
          grep -A 8 '^Package: com.shajon.fbplus$' Packages
      - name: Commit updated package indexes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debs Packages Packages.gz
          if git diff --cached --quiet; then
            echo "APT repository already up to date."
          else
            git commit -m "Publish latest Facebook Plus rootless release"
            git push
          fi
